name: Temporary macOS package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: macOS arm64 package
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-01
          targets: aarch64-apple-darwin

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install appdmg
        run: npm install -g appdmg

      - name: Build macOS app
        working-directory: apps/flutter
        env:
          FLUTTER_XCODE_ARCHS: arm64
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: "NO"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          set -euo pipefail
          cp pubspec-desktop.yaml pubspec.yaml
          flutter pub get
          flutter build macos --release

      - name: Package artifacts
        working-directory: apps/flutter
        run: |
          set -euo pipefail
          rel="build/macos/Build/Products/Release"
          mkdir -p dist
          (cd "$rel" && zip -qry "${OLDPWD}/dist/pocket-codex-macos-arm64.zip" pocket_codex.app)
          cat > "$rel/appdmg.json" <<'JSON'
          {
            "title": "Pocket-Codex",
            "icon": "pocket_codex.app/Contents/Resources/AppIcon.icns",
            "contents": [
              { "x": 448, "y": 188, "type": "link", "path": "/Applications" },
              { "x": 192, "y": 188, "type": "file", "path": "pocket_codex.app" }
            ]
          }
          JSON
          (cd "$rel" && appdmg appdmg.json "${OLDPWD}/dist/pocket-codex-macos-arm64.dmg")
          shasum -a 256 dist/* > dist/SHA256SUMS

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: pocket-codex-macos-arm64-${{ github.run_id }}
          path: apps/flutter/dist/
          if-no-files-found: error
